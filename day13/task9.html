<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Dashboard</title>

<style>

.dashboard {
    display: grid;
    grid-template-columns: 150px 1fr;
    grid-template-rows: 50px 1fr;
    height: 100vh;
}


.sidebar {
    background: #333;
    color: white;
    padding: 10px;
    grid-row: 1 / span 2;
}


.topbar {
    background: #ddd;
    padding: 10px;
}


.stats {
    display: flex;
    gap: 10px;
    padding: 10px;
}

.stat {
    background: #f2f2f2;
    padding: 15px;
    flex: 1;
    text-align: center;
}


.main {
    padding: 10px;
}

@media(max-width:600px){
    .dashboard {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr;
    }
    .sidebar {
        grid-row: auto;
    }
    .stats {
        flex-direction: column;
    }
}
</style>

</head>
<body>

<div class="dashboard">

    <div class="sidebar">
        <h3>Menu</h3>
        Dashboard<br>
        Users<br>
        Settings
    </div>

    <div class="topbar">
        <strong>Dashboard</strong>
    </div>

    <div class="stats">
        <div class="stat">Users: 120</div>
        <div class="stat">Sales: 80</div>
        <div class="stat">Orders: 30</div>
    </div>

    <div class="main">
        <h3>Main Content</h3>
        <p>This is your dashboard area.</p>
    </div>

</div>

</body>
</html>
