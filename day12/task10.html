<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Grid Row — Build a responsive photo strip where images maintain aspect ratio and are vertically centered; use align-items and object-fit on images.</title>
    <style>
        .continer{
            display: flex;
            flex-direction: row;
            justify-content:center;
            align-items:center;
            padding: 20px;
            background-color: bisque;
           flex-wrap: wrap;
           gap: 30px;
        }
        img{
            height: 100px;
            width: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 5px solid red;
        }
    </style>
</head>
<body>
    <div class="continer">
        
        <img src="./0ec86646a794b0abf44e2911952e3aa4.jpg" alt="pic1">
        <img src="./25e10672210cb3b944f02eea967fa5f5.jpg" alt="pic2">
        <img src="./629bd5eec18028279788f5d63e29981b.jpg" alt="pic3">
        <img src="./add5bc79cd67e1e5bca31382ab6540ea.jpg" alt="pic4">
        <img src="./add5bc79cd67e1e5bca31382ab6540ea.jpg" alt="pic4">
    </div>
</body>
</html>
