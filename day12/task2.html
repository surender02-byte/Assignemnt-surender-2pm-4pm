<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a 3-item card row where items have equal width and 20px gap.</title>
<style>
    .container{
        display: flex;
        gap: 20px;
    }
    .cards{
        flex: 1;
        padding: 20px;
        background-color: chartreuse;
        border-radius: 10px;
        text-align: center;
    
    }
</style>
</head>
<body>
    <div class="container">
        <div class="cards">card1</div>
        <div class="cards">card2</div>
        <div class="cards">card3</div>
    </div>
</body>
</html>
