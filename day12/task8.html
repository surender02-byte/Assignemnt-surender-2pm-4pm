<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Layout</title>
    <style>
        .body{
            margin: 0%;
        }
        .continer{
            height: 100vh;
            display: flex;
            flex-direction: column;
            
        }
        .msg{
            flex: 1;
            display: flex;
            flex-direction: column-reverse; 
            overflow-y: auto;
            padding: 10px;
            background: #f1e55e;

        }
        .tx{
            background: rgb(221, 124, 124);
            padding: 5px;
            margin: 5px 0;
            width: fit-content;
            border-radius: 5px;
        }
        .input-area {
            padding: 10px;
            background: #ddd;
        }

    </style>
</head>
<body>
    <div class="continer">
        <div class="msg">
           <div class="tx"> HELLO!</div>
           <div class="tx"> HOW ARE YOU</div>
           <div class="tx"> WELCOME TO THE CHAT</div>
        </div>

            <div class="input-area">
            <input type="text" placeholder="Type a message..." style="width:80%;">
            <button>Send</button>
            </div>
        
           
        
    </div>
</body>
</html>
