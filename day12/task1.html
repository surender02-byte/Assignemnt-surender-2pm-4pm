<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a horizontal navigation where items are centered horizontally and vertically inside a 60px bar</title>
<style>
    .container{
        height: 60px;
        display: flex;
        background-color: bisque;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap:20px;
      
    }
    .container a{
        text-decoration: none;
         padding: 8px 16px;
        background-color: aqua;
        border: 3px solid red;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        display: inline-block;
    }
</style>

</head>
<body>
    <div class="container">
        
            <a href="">home</a>
            <a href="">control</a>
            <a href="">about</a>
        
    </div>
</body>
</html>
