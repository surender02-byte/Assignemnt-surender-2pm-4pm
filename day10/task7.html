<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a sticky navbar that stays at top while scrolling.</title>

    <style>
        .container{
            height: 3000px;
            margin-top: 40px;
            background-color: blue;
            
        }
        .box{
            display: flex;
            flex-direction:row;
            justify-content:center;
           gap: 20px;
           background-color: bisque;
           padding: 20px;
           position: sticky;
           top: 10px;

        }
       
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
           <a href="">home</a>
           <a href="">about</a>
           <a href="">Contact</a>
        </div>
    </div>
</body>
</html>
