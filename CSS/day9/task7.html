<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header with Logo + Nav + Action</title>
    <style>
        .continer{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background-color: bisque;
            gap: 20px;
        }
        .box{
            line-height: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            
        }
        a{
            text-decoration: none;

        }
        .bx{
           margin-right: 5px;
            width: 60px;
            display: flex;
             justify-content: center;
            align-items: center;
        }
        button{
            padding: 5px;
            
            background-color: chartreuse;
        }

    </style>
</head>
<body>
    <div class="continer">
    <header><h1>MYLOGO</h1></header>

    <div class="box">
        <a href="">home</a>
        <a href="">about</a>
        <a href="">pricing</a>
        <a href="">contact</a>
    </div> <div class="bx"><button>sign up</button></div>
    
    </div>
</body>
</html>
