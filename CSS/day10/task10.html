<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a notification badge using position: absolute.</title>

<style>
    .box1{
        width: 190px;
        border: 2px solid black;
        background-color: rgb(144, 246, 212);
        border-radius: 20px;
    }

    .box2{
        background-color: red;
        height: 15px;
        width: 15px;
        border: 2px solid red;
        border-radius: 50px;
        position: absolute;
        top: 0px;
        left: 195px;
text-align: center;
color: aliceblue;
    }
</style>
</head>

<body>
    <div class="box1">
        <p>Lorem ipsum dolor sit amet.</p>
         <div class="box2">2
    </div>
    </div>
   
</body>
</html>
