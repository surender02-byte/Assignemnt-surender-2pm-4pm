<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make 4 boxes each using a different color format</title>
    <style>
        .continer{
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            border-radius: 10px;
        }
        .box1{
            height: 100px;
            width: 150px;
            border: 2px solid red;
            background-color: rgb(100, 450,333);
        }
        .box2{
            height: 100px;
            width: 150px;
            border: 2px solid red;
            background-color: rgb(100, 450,30);
        }
        .box3{
             height: 100px;
            width: 150px;
            border: 2px solid red;
            background-color: rgb(2000, 350,10);
        }
        .box{
            height: 100px;
            width: 150px;
            border: 2px solid red;
            background-color: rgb(4000, 1000,200);
        }
    </style>
</head>
<body>
    <div class="continer">
<div class="box1">box1</div>
<div class="box2">box2</div>
<div class="box3">box3</div>
<div class="box">box4</div>
    </div>
</body>
</html>
