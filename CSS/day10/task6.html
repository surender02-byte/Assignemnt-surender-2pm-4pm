<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
    <style>
        .card {
            width: 220px;
            border: 10px solid white;
            padding: 20px;

            border-radius: 5px;
        }

        .edu {
            font-weight: bold;
        }
        .aa{

  font-optical-sizing: auto;
  font-weight: weight;
  font-style: normal;
  font-variation-settings:
    "slnt" 0,
    "wdth" 100,
    "CTRS" 0;
        }
    </style>
</head>
