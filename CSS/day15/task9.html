    <title>Build a Photo Gallery using responsive minmax() + auto-fill.</title>
<style>
    .contanier{
        display: grid;
        grid-template-columns:repeat(auto-fill, minmax(150px,1fr)) ;
        gap: 10px;
        padding: 20px;
        background-color: bisque;
    }
    .image{
        
        height: 150px;
        width: 150px;
        object-fit: cover;
        border-radius: 3px;
       
      
    }
    h2{
       
        justify-content: center;
        background-color: bisque;
        text-transform: uppercase;    }
</style>
</head>
