<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a heading whose size changes on mobile.</title>
    <style>
        .box{
            font-size: small;
        }
        @media (max-width:800px) {
            h1{
                font-size:x-small;
                text-transform: uppercase;
            
            }
            
        }
    </style>
</head>
<body>
    <h1 class="box">Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus, eaque?</h1>
</body>
</html>
