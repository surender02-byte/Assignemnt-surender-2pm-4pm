<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resize an image to full width on small mobiles.</title>
    <style>
        .box {
            height: 100%;
            width: 100%;
            background-color: rgb(164, 164, 14);
        }
        img{
            height: 200px;
            width: 300px;
            padding: 20px;
            background-color: chocolate;
            border: 4px solid black;
            border-radius: 50px;
        }
        @media (min-width:600px) and (max-width:700px) {
            img{
             height: 400px;
            width: 600px;
            padding: 20px;
            background-color: rgb(112, 100, 91);
            border: 4px solid rgb(224, 150, 150);
            border-radius: 50px;
            }
            
        }
    </style>
</head>
<body>
    <div id="box">
        <img src="./0ec86646a794b0abf44e2911952e3aa4.jpg" alt="image">
    </div>
</body>
</html>
