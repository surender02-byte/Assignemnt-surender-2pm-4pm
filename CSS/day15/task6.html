<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a complete responsive hero section.</title>
<style>
    .box{
        height: 100vh;
        width: 100%;
        background-image: url(./7bfd875e85fbbed980e9df59bcde8579.jpg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        
        color: white;
    
    }
    .box h1{
     
        text-transform: uppercase;
        color: rgb(241, 242, 244);
    }
.box p{
    font-size:medium;
text-transform: uppercase;
font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}
.box button{
    height: 30px;
    width: 70px;
   background-color: chocolate;
   color: aliceblue;
   border-radius: 20px;
}
@media (max-width:600px) {
    .box h1{
        font-size: small;
    }
    
}
</style>
</head>
<body>
    <div class="box">
    <h1>welcome to our store</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate nesciunt hic iure soluta earum autem.</p>
<button>sign up</button></div>
</body>
</html>
