<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a flex container that spaces items evenly.</title>
<style>
    .contianer{
        display:flex;
        flex-direction: row;
        justify-content:space-evenly;
        align-items:center;
        background-color: #ad11ad;
        padding: 30px;
        border-radius: 10px;
    }
    .contianer div{
        background-color: deepskyblue;
        padding: 20px;
        border-radius: 10px;
        width: 20px;
        text-align: center;
        border: 3px solid black;
    }
</style>

</head>
<body>
    <div class="contianer">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
