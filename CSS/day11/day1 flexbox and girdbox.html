<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a block element that spans full width and an inline element beside text</title>
<style>
    span{
        display: block  ;
    }
</style>
</head>
<body>
    <span style="display: block;" >lorem</span>
    <span>Lorem ipsum dolor sit amet.</span>
</body>
</html>
