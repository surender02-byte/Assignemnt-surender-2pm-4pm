<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reate a 2-column grid using 1fr 1fr</title>
    <style>
        .box{
            display: grid;
            grid-template-columns: 1fr 1fr ;
        gap: 20px;
        }
        .item1{
            display: flex;
            height: 150px;
            background:linear-gradient(to right, #fefefe,#5a5858);
            text-align: center;
            justify-content: center;
            align-items: center;
            font-size: xx-large;
            font-weight: bold;
           
            
        }
           .item{
            display: flex;
            height: 150px;
            background:linear-gradient(to left, #b27c20,#bcee67);
            text-align: center;
            justify-content: center;
            align-items: center;
            font-size: xx-large;
            font-weight: bold;
           
            
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item1">1</div>
        <div class="item">2</div>
    </div>
</body>
</html>
