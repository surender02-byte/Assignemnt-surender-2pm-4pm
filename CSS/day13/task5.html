<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Equal Columns</title>

<style>
.container {
    display: grid;
    grid-template-columns: repeat(4, 1fr); 
    gap: 10px;
}

.item {
    background: lightblue;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
</div>

</body>
</html>
