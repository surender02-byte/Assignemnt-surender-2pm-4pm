<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reate a 2-column grid using 1fr 1fr</title>
    <style>
        .box{
            display: grid;
            grid-template-rows: 100px 100px 100px ;
            gap: 20px;
         }
        
           .item1{
            display: flex;
            height: 150px;
            background-color: rgb(253, 211, 3);
            text-align: center;
            justify-content: center;
            align-items: center;
            font-size: xx-large;
            font-weight: bold;
            margin: 10px; 
            
        }
        .item2{
            display: flex;
            height: 150px;
            background-color: rgb(253, 211, 3);
            text-align: center;
            justify-content: center;
            align-items: center;
            font-size: xx-large;
            font-weight: bold;
            margin: 10px;  
        }
        .item3{
            display: flex;
            height: 150px;
            background-color: rgb(253, 211, 3);
            text-align: center;
            justify-content: center;
            align-items: center;
            font-size: xx-large;
            font-weight: bold;
            margin: 10px;  
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item1">Row1</div>
        <div class="item2">Row2</div>
        <div class="item3">Row3</div>
    </div>
</body>
</html>
