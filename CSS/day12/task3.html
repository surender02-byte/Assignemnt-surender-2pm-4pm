<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a toolbar where one button is left, one is centered, and one is right using flex.</title>

<style>
.container{
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    background-color: bisque;
    height:60px;
}
button{
    background-color: crimson;
    text-transform: uppercase;
    height: 30px;
    border: 2px solid black;
    border-radius: 10px;
}
</style>
</head>
<body>
    <div class="container">
        <button>post</button>
        <button>center</button>
        <button>submit</button>
    </div>
</body>
</html>
