<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert 2 columns → 1 column using media query.</title>
<style>
    .item{
        display: grid;
        grid-template-columns: repeat(2,1fr );
         gap: 20px;
    }
    .box
    { 
        background-color: chocolate;
        border: 4px solid;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
       
     }
     @media  (max-width:600px)
     {
        .item{
            display: grid;
            grid-template-columns: 1fr;
     }
     }
</style>
</head>
<body>
    <div class="item">
    <div class="box">column</div>
    <div class="box">column</div>
</div>
</body>
</html>
