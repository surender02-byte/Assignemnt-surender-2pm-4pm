<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Footer</title>

<style>
footer {
    background: #222;
    color: white;
    padding: 40px 20px;
}


.footer-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}


.footer-box h3 {
    margin-bottom: 10px;
    font-size: 18px;
}

.footer-box p,
.footer-box a {
    color: #ccc;
    font-size: 14px;
    text-decoration: none;
}


@media (max-width: 600px) {
    .footer-grid {
        grid-template-columns: 1fr;
    }
}
</style>

</head>
<body>

<footer>

    <div class="footer-grid">

        <div class="footer-box">
            <h3>About Us</h3>
            <p>We provide quality products and services worldwide.</p>
        </div>

        <div class="footer-box">
            <h3>Services</h3>
            <p>Web Development</p>
            <p>App Design</p>
            <p>Digital Marketing</p>
        </div>

        <div class="footer-box">
            <h3>Quick Links</h3>
            <a href="#">Home</a><br>
            <a href="#">About</a><br>
            <a href="#">Contact</a>
        </div>

        <div class="footer-box">
            <h3>Contact</h3>
            <p>Email: support@example.com</p>
            <p>Phone: +91 9876543210</p>
        </div>

    </div>

</footer>

</body>
</html>
