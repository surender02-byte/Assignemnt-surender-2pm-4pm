<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a navbar change direction at 600px.</title>
<style>
    nav {
        display: flex;
        flex-direction: row;
        justify-content:center;
        align-items: center;
        gap: 20px;
        text-decoration: none;
        background-color: chocolate;
        border: 3px solid blue;
    }
@media (max-width: 600px) {
    nav{
        display: flex;
        flex-direction: column;
    }
}
</style>
</title>
</head>
<body>
    <nav>
        <a href="">home</a>
        <a href="">contact</a>
        <a href="">about</a>
    </nav>
</body>
</html>
