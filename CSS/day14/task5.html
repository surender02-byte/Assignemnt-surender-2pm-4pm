<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resize an image to full width on small mobiles.</title>

<style>
    .box img{
        height: 100px;
        width: 150px;
    }
   @media (min-width:600px) {
      .box img{
        height: 150px;
        width: 300px;
      }
   }
</style>
</head>
<body>
      <div class="box">
        <img src="./0ec86646a794b0abf44e2911952e3aa4.jpg" alt="image">
      </div>
</body>
</html>
