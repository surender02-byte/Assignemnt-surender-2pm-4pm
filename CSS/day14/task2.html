<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a heading that shrinks in small screens.</title>
<style>
    .box{
        display: flex;
        text-transform: uppercase;
        color: chocolate;
        font-weight: 300px;
        font-size: xx-large;
        flex-wrap: wrap;
    }
</style>
</head>
<body>

        <header class="box">Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellendus ipsam doloribus aliquid enim maxime voluptatibus laudantium minus perspiciatis. Corporis, quo.</header>

</body>
</html>
