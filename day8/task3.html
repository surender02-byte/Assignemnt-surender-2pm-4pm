<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make two boxes with different margin values and compare spacing</title>
    <style>
        .box{
              width: 200px;
            height: 200px;
            padding: 5px;
            border: 5px dotted rgb(9, 31, 174);
            margin: 30px ;
        }
        .bo{
            width: 200px;
            height: 200px;
            padding: 25px;
            border: 5px solid red;
            margin: 50px ;
        }
    </style>
</head>
<body>
    <div class="box">Lorem ipsum dolor sit amet consectetur adipisicing elit.</div>
    <div class="bo">Lorem ipsum dolor sit amet consectetur adipisicing elit.</div>
</body>
</html>
