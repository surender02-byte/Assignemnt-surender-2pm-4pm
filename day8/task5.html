<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment with box-sizing: border-box and content-box.</title>
<style>
    *{
        box-sizing: border-box;
    }
    .border-box{
        width: 200px;
        height: 200px;
        padding: 10px;
        border: 5px solid hotpink;
        margin: 20px;
        background-color: aquamarine;
        box-sizing: border-box;
    }
    .content-box
    {
         width: 200px;
        height: 200px;
        padding: 10px;
        border: 5px solid seagreen;
        margin: 20px;
        background-color: coral;
        box-sizing: content-box;
    }
</style>
</head>

<body>
    <div class="border-box">its limit width and height</div>
     <div class="content-box">default values</div>
</body>
</html>
