<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>

    <style>
        .box {
            width: 220px;
            padding: 15px;
            border: 4px solid black;   /* border style */
            margin: 20px;
            text-align: center;
        }

        .box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .box .header {
            font-weight: bold;
            font-size: 20px;
        }

        .box .price {
            font-size: 18px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box" style="border: 4px solid black;">
        <ul>
            <li class="header" >Basic</li>
            <li class="price">$10.00</li>
            <li>10 GB Storage</li>
            <li>10 Emails</li>
            <li>10 Domains</li>
            <li >1 GB Bandwidth</li>
        </ul>
        <button>Sign Up</button>
    </div>

</body>
</html>
