<!-- Use innerHTML to insert formatted HTML (<b>, <i>) dynamically. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>innerHTML Example</title>
</head>
<body>

    <p id="text"></p>
    <button onclick="addText()">Add Formatted Text</button>

    <script>
        function addText() {
            document.getElementById("text").innerHTML =
                "<b>This text is bold</b> and <i>this text is italic</i>";
        }
    </script>

</body>
</html>
