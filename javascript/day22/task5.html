<!-- Add a click event to change the background color of the page. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="colorchange">change the background color </button>

    <script>
        document.getElementById("colorchange").addEventListener("click",
            function () {
                document.body.style.backgroundColor="red";
            }
        ); 
    </script>
</body>
</html>
