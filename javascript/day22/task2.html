<!-- Use querySelector() to change the color of a paragraph. -->

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p class="info">Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi, porro?</p>
     <button onclick="changecolor()">change the paragraph color</button>
<script>
     function changecolor() {
        document.querySelector(".info").style.color="blue";
     }
</script>
</body>
</html>
