<!-- Create an input field and use the input event to display typed text live. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="btn" placeholder="type here">

    <script>
        let li = document.getElementById('btn');
        document.addEventListener('keydown',(event)=>{
        console.log("event.key: ",event.key);
        });

    </script>
</body>
</html>
