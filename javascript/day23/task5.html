<!-- Prevent form submission using the submit event and event.preventDefault().
  -->

  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <form id="forms">
        <input type="text" name="" id="btn">
        <button>submit</button>
    </form>

    <script>
        document.getElementById('forms').addEventListener('submit',
            function (e) {
                e.preventDefault();
                alert('form submited');
            }
        );
    </script>
  </body>
  </html>
