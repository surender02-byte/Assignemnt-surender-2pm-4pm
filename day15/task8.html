<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a responsive pricing table.</title>
<style>
    body{
        margin: 0%;
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
        background-color: coral;
        
    }
    .container{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        padding: 10px;
        gap: 10px;
    }
    .container .box{
        padding: 10px;
        text-align: center;
        border: 4px solid ;
        background-color: bisque;
        gap: 10px;
        border-radius: 10px;
font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
    .prize{
        font-size: xx-large;
    }
button{

    color: aliceblue;
}
h3{
    text-transform: uppercase;
    color: grey;
}
h1{
    text-transform: uppercase;
    text-align: center;
}
</style>
</head>
