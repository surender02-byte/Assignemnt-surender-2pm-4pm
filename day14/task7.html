<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Service Layout</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    .services {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 40px;
    }

    .service-box {
        background: white;
        padding: 25px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .service-box h3 {
        margin-bottom: 10px;
        font-size: 22px;
    }

    .service-box p {
        color: #555;
        font-size: 15px;
    }

   
    @media (max-width: 700px) {
        .services {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<h2 style="text-align:center; margin: 20px 0;">Our Services</h2>

<div class="services">

    <div class="service-box">
        <h3>Website Development</h3>
        <p>We create modern, responsive websites for your business.</p>
    </div>

    <div class="service-box">
        <h3>Mobile App Design</h3>
        <p>User-friendly app designs for both Android and iOS.</p>
    </div>

    <div class="service-box">
        <h3>Digital Marketing</h3>
        <p>Grow your brand through SEO, ads, and social media campaigns.</p>
    </div>

</div>

</body>
</html>
