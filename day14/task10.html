<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Product Page</title>

<style>
    body {
        font-family: Arial;
        margin: 0;
        padding: 0;
        background: #f5f5f5;
    }

    h2 {
        text-align: center;
        padding: 20px;
    }

    
    .products {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 20px;
    }

   
    .card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
    }

    .card h3 {
        margin: 10px 0 5px;
    }

    .card p {
        color: #555;
        margin-bottom: 10px;
    }

    .card button {
        padding: 8px 15px;
        background: teal;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

   
    @media (max-width: 700px) {
        .products {
            grid-template-columns: 1fr;
        }
    }
</style>

</head>
<body>

<h2>Our Products</h2>

<div class="products">

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/61h-KoEvL2L._AC_UY1000_.jpg" alt="Shoes">
        <h3>Running Shoes</h3>
        <p>Comfortable & Lightweight</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/81xTS3p1Z-L._AC_UY1000_.jpg" alt="Watch">
        <h3>Smart Watch</h3>
        <p>Track your daily fitness</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/71JtIXWWG0L._AC_UY1000_.jpg" alt="Bag">
        <h3>Travel Backpack</h3>
        <p>Strong & Waterproof</p>
        <button>Add to Cart</button>
    </div>

</div>

</body>
</html>
