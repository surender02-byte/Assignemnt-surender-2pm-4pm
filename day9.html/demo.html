<!DOCTYPE html>
<html>
<head>
    <title>Photo Strip</title>
    <style>
        .strip {
            display: flex;
            align-items: center;     /* vertical centering */
            justify-content: center; /* horizontal alignment */
            gap: 10px;
            padding: 10px;
            background: #f2f2f2;
            flex-wrap: wrap;         /* responsive */
        }

        .strip img {
            width: 150px;
            height: 100px;
            object-fit: cover;       /* keep aspect ratio, crop if needed */
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="strip">
    <img src="img1.jpg" alt="Photo 1">
    <img src="img2.jpg" alt="Photo 2">
    <img src="img3.jpg" alt="Photo 3">
    <img src="img4.jpg" alt="Photo 4">
</div>

</body>
</html>
