<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a 3-item card row where items have equal width and 20px gap.</title>

<style>
    .box{
        display: flex;
        flex-direction: row;
        align-items: center;
        background-color: antiquewhite;
        gap: 20px;
    }
    a{
    
        background-color: rosybrown;

    }
</style>

</head>
<body>
    <div class="box">
        <a href="">card1</a>
        <a href="">card2</a>
        <a href="">card3</a>
    </div>
</body>
</html>
